[project]
name = "chess-analyzer"
version = "0.1.0"
description = "AI chess coach: Stockfish analysis + LLM coaching with memory/RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-chess>=1.11",
    "requests>=2.32",
    "zstandard>=0.23",   # decompress Lichess .pgn.zst dumps
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Phase 2+ (LLM coaching, RAG) — installed later
coach = [
    "ollama>=0.3",
]
# Phase 3 eval harness — frontier judge backends (optional; local Ollama judge needs none)
eval = [
    "anthropic>=0.40",
    "google-genai>=0.1",
    "python-dotenv>=1.0",   # load API keys from a gitignored .env
]
# Phase 6 — the web dashboard. Server-rendered, so no JS toolchain.
api = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",   # FastAPI needs this to read HTML form posts
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # FastAPI's TestClient transport
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "coach*", "training*", "memory*", "api*", "eval*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

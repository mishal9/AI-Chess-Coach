# Deploys the human-rating page to GitHub Pages. The Supabase URL (repository variable) and
# publishable key (repository secret) are substituted here, so they never live in git.
name: rating page

on:
  push:
    branches: [master]
    paths:
      - eval/human/round2/rating_page.html
      - .github/workflows/rating-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL variable is not set"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is not set"; exit 1; }
          mkdir _site
          python3 - <<'PY'
          import os
          src = open("eval/human/round2/rating_page.html", encoding="utf-8").read()
          for name in ("SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY"):
              token = f"__{name}__"
              assert src.count(token) == 1, f"expected one {token} in the page"
              src = src.replace(token, os.environ[name])
          open("_site/index.html", "w", encoding="utf-8").write(src)
          PY
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
